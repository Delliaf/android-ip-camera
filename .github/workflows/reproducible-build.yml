name: Reproducible Build

on:
  push:
    branches:
      - main
      - feature/manual-camera-4k-stream
    paths-ignore:
      - 'DEVELOPMENT_HISTORY.txt'
      - 'AGENTS.md'
      - 'LG_G6_H872_MAIN0.md'
      - 'FORK_ANDROID8.md'
  pull_request:
    paths-ignore:
      - 'DEVELOPMENT_HISTORY.txt'
      - 'AGENTS.md'
      - 'LG_G6_H872_MAIN0.md'
      - 'FORK_ANDROID8.md'
  workflow_dispatch:

concurrency:
  group: reproducible-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-reproducible:
    # Same-repo PRs are already tested by a branch push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Install Rust and the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build release APK (first)
        run: |
          bash scripts/ci-gradle-retry.sh clean test :app:assembleRelease \
            -PskipSigning \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.parallel=false
          mkdir -p build/unsigned
          cp app/build/outputs/apk/release/*arm64-v8a-release.apk build/unsigned/build1.apk

      - name: Clean and build release APK (second)
        run: |
          bash scripts/ci-gradle-retry.sh clean :app:assembleRelease \
            -PskipSigning \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.parallel=false
          mkdir -p build/unsigned
          cp app/build/outputs/apk/release/*arm64-v8a-release.apk build/unsigned/build2.apk

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope

      - name: Compare APKs
        run: |
          cmp -s build/unsigned/build1.apk build/unsigned/build2.apk
          echo "Reproducible build verification passed (APKs are identical)."

      - name: diffoscope report on failure
        if: failure()
        continue-on-error: true
        run: diffoscope build/unsigned/build1.apk build/unsigned/build2.apk > diffoscope.txt || true

      - name: Upload diffoscope report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diffoscope-report
          path: diffoscope.txt
          retention-days: 7
